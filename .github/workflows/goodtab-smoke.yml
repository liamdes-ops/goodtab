name: GOODTAB smoke test
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/goodtab-smoke.test.mjs
